<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>S級リーグ</title>
  <meta name="description" content="S級リーグの公式ハブサイト。ロスター・ルール・シーズン結果にアクセスできます。" />
  <style>
    :root {
      --bg-page:       #0a0f0d;
      --bg-card:       #0f1610;
      --bg-surface:    #141f16;
      --accent:        #00e676;
      --accent-dim:    rgba(0, 230, 118, 0.10);
      --accent-border: rgba(0, 230, 118, 0.30);
      --text-primary:  #e0f2e9;
      --text-secondary:#7a9e85;
      --text-muted:    #3d5c45;
      --border:        rgba(255,255,255,0.07);
      --border-strong: rgba(255,255,255,0.13);
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI",
              "Hiragino Kaku Gothic ProN", "Hiragino Sans",
              "Yu Gothic", Meiryo, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font);
      min-height: 100vh;
      line-height: 1.6;
    }

    a { color: inherit; text-decoration: none; }

    /* ── layout ── */
    .shell {
      max-width: 860px;
      margin: 0 auto;
      padding: 72px 24px 96px;
    }

    /* ── eyebrow ── */
    .eyebrow {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 14px;
    }

    /* ── hero ── */
    .hero-title {
      font-size: clamp(42px, 7vw, 72px);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.0;
      color: var(--text-primary);
    }

    .hero-title span {
      color: var(--accent);
    }

    .hero-sub {
      margin-top: 16px;
      font-size: 15px;
      color: var(--text-secondary);
      max-width: 480px;
    }

    /* ── divider ── */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--accent-border);
      margin: 40px 0;
    }

    /* ── nav grid ── */
    .nav-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .nav-card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 22px;
      background: var(--bg-card);
      border: 1px solid var(--border-strong);
      border-radius: 5px;
      transition: border-color 0.14s, background 0.14s;
      min-height: 110px;
      cursor: pointer;
    }

    .nav-card:hover {
      border-color: var(--accent-border);
      background: var(--accent-dim);
    }

    .nav-card.disabled {
      opacity: 0.45;
      cursor: default;
      pointer-events: none;
    }

    .nav-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .nav-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 2px;
      white-space: nowrap;
    }

    .nav-badge.live {
      background: var(--accent-dim);
      color: var(--accent);
      border: 1px solid var(--accent-border);
    }

    .nav-badge.soon {
      background: rgba(255,255,255,0.05);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .nav-badge.done {
      background: rgba(255,255,255,0.04);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .nav-title {
      margin-top: 14px;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .nav-card:hover .nav-title {
      color: var(--accent);
    }

    .nav-arrow {
      display: inline-block;
      font-size: 13px;
      color: var(--text-muted);
      transition: transform 0.12s, color 0.12s;
      margin-top: 6px;
    }

    .nav-card:hover .nav-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    /* ── season section title ── */
    .section-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* ── footer ── */
    .footer {
      margin-top: 64px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="shell">

    <header>
      <p class="eyebrow">Official Hub</p>
      <h1 class="hero-title">S級<span>リーグ</span></h1>
      <p class="hero-sub">ロスター・ルール・各シーズンの試合結果はこちらから。</p>
    </header>

    <div class="divider"></div>

    <!-- General -->
    <div class="section-label">General</div>
    <div class="nav-grid" style="margin-bottom: 32px;">

      <a class="nav-card" href="https://YOUR-HUB-DOMAIN/roster.html">
        <div class="nav-card-top">
          <span class="nav-label">Roster</span>
          <span class="nav-badge done">参加者</span>
        </div>
        <div>
          <div class="nav-title">ロスター</div>
          <div class="nav-arrow">→</div>
        </div>
      </a>

      <a class="nav-card" href="https://YOUR-HUB-DOMAIN/rules.html">
        <div class="nav-card-top">
          <span class="nav-label">Rules</span>
          <span class="nav-badge done">規定</span>
        </div>
        <div>
          <div class="nav-title">ルール</div>
          <div class="nav-arrow">→</div>
        </div>
      </a>

    </div>

    <!-- Seasons -->
    <div class="section-label">Seasons</div>
    <div class="nav-grid">

      <a class="nav-card" href="https://YOUR-S1-DOMAIN">
        <div class="nav-card-top">
          <span class="nav-label">Season 1</span>
          <span class="nav-badge done">終了</span>
        </div>
        <div>
          <div class="nav-title">S1 結果</div>
          <div class="nav-arrow">→</div>
        </div>
      </a>

      <a class="nav-card disabled" href="#">
        <div class="nav-card-top">
          <span class="nav-label">Season 2</span>
          <span class="nav-badge soon">近日公開</span>
        </div>
        <div>
          <div class="nav-title">S2 結果</div>
          <div class="nav-arrow">→</div>
        </div>
      </a>

    </div>

    <footer class="footer">
      <p>S級リーグ &mdash; 公式サイト</p>
    </footer>

  </div>
</body>
</html>
