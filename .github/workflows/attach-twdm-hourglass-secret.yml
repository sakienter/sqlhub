name: Attach TWDM hourglass secret

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/attach-twdm-hourglass-secret.yml'

permissions:
  contents: write

jobs:
  attach-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add script tag
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('public/tournaments/twdm/index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="./hourglass-secret.js?v=20260616"></script>'

          if tag not in text:
              text = text.replace('</body>', tag + '</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tournaments/twdm/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Attach TWDM hourglass secret script"
          git push
