name: Apply repository cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'maintenance/repository-cleanup-20260613'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply cleanup
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/scripts/apply_cleanup.py ]]; then
            python3 .github/scripts/apply_cleanup.py
          else
            echo "Cleanup has already been applied."
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean up repository structure"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
