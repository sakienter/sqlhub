name: Connect CN vs JP video
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/connect-cnvsjp-video.yml
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect assets
        run: |
          FILE=public/tournaments/cn-vs-jp/index.html
          grep -q 'video-modal.css' "$FILE" || sed -i 's#</head>#<link rel="stylesheet" href="./video-modal.css?v=20260616" /></head>#' "$FILE"
          grep -q 'yoshiyuki-video.js' "$FILE" || sed -i 's#</body>#<script src="./yoshiyuki-video.js?v=20260616"></script></body>#' "$FILE"
      - name: Save
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/tournaments/cn-vs-jp/index.html
          git diff --cached --quiet || git commit -m "Connect CN vs JP yoshiyuki video"
          git push
