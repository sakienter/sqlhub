name: Attach Topseries clip v2
on:
  push:
    paths:
      - '.github/workflows/attach-topseries-clip-v2.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update page
        run: ruby -pi -e 'sub(%r{</body>}, %q{<script src="./topseries-clip.js?v=20260616"></script></body>}) unless $_.include?("topseries-clip.js")' public/tournaments/topseries/index.html
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/tournaments/topseries/index.html
          git commit -m "Attach Topseries clip script" || exit 0
          git push
