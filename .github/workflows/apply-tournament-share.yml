name: Apply tournament share controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-tournament-share.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add shared loader to tournament pages
        run: |
          python - <<'PY'
          from pathlib import Path

          loader = '<script src="/tournament-share.js?v=20260614-compact" defer></script>'
          targets = sorted(Path('public/tournaments').glob('*/index.html'))
          targets += [Path('public/sq/season1/index.html'), Path('public/sq/season2/index.html')]

          for path in targets:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              if 'tournament-share.js' in text or '</body>' not in text or 'page-shell' not in text:
                  continue
              prefix = '\n  ' if '\n' in text else ''
              text = text.replace('</body>', f'{prefix}{loader}{prefix}</body>', 1)
              path.write_text(text, encoding='utf-8')
              print(path)
          PY

      - name: Commit generated page updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tournaments public/sq
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Add compact share controls to tournament pages"
          git push
