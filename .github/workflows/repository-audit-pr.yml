name: Repository audit (PR)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Inventory and reference audit
        run: python3 .github/scripts/repo_audit.py
      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            echo "CHECK $file"
            if ! node --check "$file"; then
              status=1
            fi
          done < <(find public functions -type f -name '*.js' -print0 2>/dev/null)
          exit "$status"
