name: Repository audit (PR)

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inventory and reference audit
        run: python3 .github/scripts/repo_audit.py > repository-audit-report.txt

      - name: JavaScript syntax check
        id: js-check
        shell: bash
        run: |
          set +e
          {
            echo
            echo '=== JAVASCRIPT SYNTAX CHECK ==='
            status=0
            while IFS= read -r -d '' file; do
              if node --check "$file" >/dev/null 2>&1; then
                echo "OK $file"
              else
                echo "ERROR $file"
                node --check "$file" 2>&1
                status=1
              fi
            done < <(find public functions -type f -name '*.js' -print0 2>/dev/null)
            echo "JS_CHECK_STATUS=$status"
          } >> repository-audit-report.txt
          exit 0

      - name: Publish audit report
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- repository-audit-report -->';
            const report = fs.existsSync('repository-audit-report.txt')
              ? fs.readFileSync('repository-audit-report.txt', 'utf8')
              : 'Audit report could not be generated.';
            const body = `${marker}\n## Repository audit report\n\n\`\`\`text\n${report.slice(0, 60000)}\n\`\`\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
