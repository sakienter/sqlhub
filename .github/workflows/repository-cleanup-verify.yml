name: Verify repository cleanup

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'maintenance/repository-cleanup-20260613'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate structure and static references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import html
          import json
          import re
          import sys

          root = Path('.')
          required = [
              'public/home.css',
              'public/admin-tribes.css',
              'public/season2/data.js',
              'public/season2/summary.js',
              'public/season2/render.js',
              'public/season2/init.js',
              'public/season2/results.css',
          ]
          removed = [
              'np',
              'tribe_icons_256_webp',
              'public/season1/admin/style.css',
              'public/season2/admin/style.css',
              'public/season1/tribes-display.css',
              'public/season2/script.js',
              'public/season2/parity.js',
              'public/season2/parity-config.js',
              'public/season2/parity-summary.js',
              'public/season2/parity-render.js',
              'public/season2/parity-extras.js',
              'public/season2/parity.css',
              'public/season2/tribes-config.js',
              'public/scrims/b2bbn.webp',
              'public/season1/yubiwa.webp',
              'public/season1/yubiwatop.webp',
              'public/season2/sky.webp',
              'public/season2/skygo.webp',
              'public/sta.webp',
              'public/tournaments/cn-vs-worlds/gt.webp',
          ]

          errors = []
          for item in required:
              if not (root / item).is_file():
                  errors.append(f'Missing required file: {item}')
          for item in removed:
              if (root / item).exists():
                  errors.append(f'Obsolete path still exists: {item}')

          attr_re = re.compile(r'''(?:src|href)\s*=\s*["']([^"']+)["']''', re.I)
          for source in root.joinpath('public').rglob('*.html'):
              text = source.read_text(encoding='utf-8')
              for raw in attr_re.findall(text):
                  raw = html.unescape(raw).strip()
                  if not raw or '${' in raw or raw.startswith(('#', 'http://', 'https://', '//', 'mailto:', 'tel:', 'data:', 'javascript:')):
                      continue
                  clean = raw.split('#', 1)[0].split('?', 1)[0]
                  if not clean:
                      continue
                  target = root / 'public' / clean.lstrip('/') if clean.startswith('/') else source.parent / clean
                  if clean.endswith('/'):
                      target = target / 'index.html'
                  if not target.exists():
                      errors.append(f'Broken HTML reference: {source} -> {raw} ({target})')

          for source in root.joinpath('public').rglob('*.json'):
              try:
                  json.loads(source.read_text(encoding='utf-8'))
              except Exception as exc:
                  errors.append(f'Invalid JSON: {source}: {exc}')

          s2 = root.joinpath('public/season2/index.html').read_text(encoding='utf-8')
          ordered = ['./data.js', './summary.js', './render.js', './init.js', '../composition-gallery.js']
          positions = [s2.find(value) for value in ordered]
          if any(position < 0 for position in positions) or positions != sorted(positions):
              errors.append('Season 2 scripts are missing or loaded in the wrong order.')

          stale_terms = ['parity-config.js', 'parity-summary.js', 'parity-render.js', 'parity-extras.js', 'tribes-config.js']
          for source in root.joinpath('public').rglob('*'):
              if not source.is_file() or source.suffix.lower() not in {'.html', '.css', '.js', '.json'}:
                  continue
              text = source.read_text(encoding='utf-8', errors='ignore')
              for term in stale_terms:
                  if term in text:
                      errors.append(f'Stale reference {term}: {source}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Structure, JSON, HTML references, and S2 load order are valid.')
          PY

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find public functions -type f -name '*.js' -print0)

      - name: Probe Cloudflare branch preview
        shell: bash
        run: |
          set -euo pipefail
          base='https://maintenance-repository-clean.sqlhub.pages.dev'
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          fetch() {
            local path="$1"
            local output="$2"
            curl --fail --silent --show-error --location \
              --retry 12 --retry-delay 5 --retry-all-errors \
              "$base$path" -o "$output"
            test -s "$output"
          }

          fetch '/' "$tmp/home.html"
          fetch '/home.css' "$tmp/home.css"
          fetch '/season1/' "$tmp/season1.html"
          fetch '/season2/' "$tmp/season2.html"
          fetch '/season2/data.js' "$tmp/data.js"
          fetch '/season2/summary.js' "$tmp/summary.js"
          fetch '/season2/render.js' "$tmp/render.js"
          fetch '/season2/init.js' "$tmp/init.js"
          fetch '/scrims/' "$tmp/scrims.html"
          fetch '/tournaments/cn-vs-worlds/' "$tmp/cn-worlds.html"

          grep -Fq './home.css?v=20260613-cleanup' "$tmp/home.html"
          grep -Fq 'Stuntdrake' "$tmp/home.html"
          grep -Fq 'S級リーグS1' "$tmp/season1.html"
          grep -Fq './data.js?v=s2-static-20260613' "$tmp/season2.html"
          grep -Fq './init.js?v=s2-static-20260613' "$tmp/season2.html"
          grep -Fq 'const API_URL' "$tmp/data.js"
          grep -Fq 'initSeasonTwo' "$tmp/init.js"
          grep -Fq '練習会：スクリム' "$tmp/scrims.html"
          grep -Fq 'CN vs Worlds' "$tmp/cn-worlds.html"
