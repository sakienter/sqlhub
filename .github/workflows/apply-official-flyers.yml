name: Apply official flyer galleries

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add flyer galleries to archive sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pages = {
              Path('public/tournaments/twdm/index.html'): [
                  './twdmf/twdmf1.webp',
                  './twdmf/twdmf2.webp',
                  './twdmf/twdmf3.webp',
                  './twdmf/twdmf4.webp',
              ],
              Path('public/tournaments/uratop/index.html'): [
                  './uratopf/uratopf1.webp',
                  './uratopf/uratopf2.webp',
                  './uratopf/uratopf3.webp',
              ],
          }

          stylesheet = '<link rel="stylesheet" href="/official-flyers.css?v=20260614" />'

          for path, images in pages.items():
              text = path.read_text(encoding='utf-8')

              if stylesheet not in text:
                  text = text.replace('</head>', stylesheet + '</head>', 1)

              if 'official-flyer-block' not in text:
                  items = ''.join(
                      f'<a class="official-flyer-item" href="{src}" target="_blank" rel="noopener">'
                      f'<img src="{src}" alt="公式フライヤー {index}" loading="lazy" decoding="async" />'
                      f'</a>'
                      for index, src in enumerate(images, start=1)
                  )
                  gallery = (
                      '<div class="official-flyer-block">'
                      '<h3 class="official-flyer-title">公式フライヤー</h3>'
                      f'<div class="official-flyer-grid">{items}</div>'
                      '</div>'
                  )

                  patterns = [
                      r'(<div class="section-title[^"]*">Archive</div><div class="section-body">)',
                      r"(<div class='section-title[^']*'>Archive</div><div class='section-body'>)",
                  ]
                  replaced = False
                  for pattern in patterns:
                      text, count = re.subn(pattern, lambda match: match.group(1) + gallery, text, count=1)
                      if count:
                          replaced = True
                          break
                  if not replaced:
                      raise RuntimeError(f'Archive section was not found in {path}')

              path.write_text(text, encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit changes
        run: |
          rm -f .github/workflows/apply-official-flyers.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tournaments/twdm/index.html public/tournaments/uratop/index.html .github/workflows/apply-official-flyers.yml
          git commit -m "feat: add official flyer galleries to archives"
          git push
