<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>リーグ集計 | S級リーグ Season 2</title>
  <meta name="description" content="S級リーグ Season 2のヒーロー、下級装飾品、上級装飾品の集計ページです。" />
  <meta property="og:title" content="リーグ集計 | S級リーグ Season 2" />
  <meta property="og:description" content="ヒーロー、下級装飾品、上級装飾品の集計データを掲載します。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://stuntdrakesavenge.pages.dev/sq/season2/league-stats/" />
  <link rel="canonical" href="https://stuntdrakesavenge.pages.dev/sq/season2/league-stats/" />
  <link rel="stylesheet" href="/common.css" />
<style>
    .stats-shell{width:min(100% - 28px,1500px);margin:0 auto;padding:40px 0 72px}
    .stats-header{color:#fff}.stats-header .back-link{margin-bottom:38px;color:rgba(255,255,255,.76);background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
    .stats-header h1{margin:0;text-align:left;color:#fff;font-size:clamp(36px,6vw,58px)}
    .stats-header p{margin:14px 0 0;color:rgba(255,255,255,.72);font-weight:750}
    .stats-content{margin-top:28px;padding:clamp(18px,3vw,34px);overflow-x:auto;border-radius:16px;background:rgba(255,250,242,.92);box-shadow:0 18px 44px rgba(3,14,24,.22);backdrop-filter:blur(9px)}
    .stats-grid{display:grid;grid-template-columns:repeat(3,minmax(300px,1fr));gap:18px;align-items:start;min-width:940px}
    .stats-column h2{margin:0 0 14px;color:#18212a;font-size:clamp(18px,2vw,24px);text-align:center}
    .stats-image-link{display:block;overflow:hidden;border-radius:4px;background:#fff;box-shadow:0 7px 20px rgba(24,33,40,.10);transition:transform .16s ease,box-shadow .16s ease}
    .stats-image-link:hover{transform:translateY(-2px);box-shadow:0 11px 28px rgba(24,33,40,.16)}
    .stats-image{display:block;width:100%;height:auto}
    @media(max-width:720px){.stats-shell{width:min(100% - 16px,1500px);padding:20px 0 50px}.stats-content{padding:16px 10px}.stats-grid{grid-template-columns:repeat(3,300px);min-width:max-content;gap:12px}.stats-column h2{font-size:16px}}
  </style>
<link rel="icon" href="/sutantic.png" type="image/png" />
</head>
<body>
  <main class="stats-shell">
    <header class="stats-header">
      <a class="back-link" href="/sq/season2/">← S級リーグ Season 2へ戻る</a>
      <h1>リーグ集計</h1>
      <p>S級リーグ Season 2</p>
    </header>
    <section class="stats-content">
      <div class="stats-grid">
        <section class="stats-column">
          <h2>ヒーロー集計</h2>
          <a class="stats-image-link" href="/season2/data/hero-stats.webp?v=20260727" target="_blank" rel="noopener">
            <img class="stats-image" src="/season2/data/hero-stats.webp?v=20260727" width="3238" height="9777" alt="S級リーグ Season 2 ヒーロー集計表" decoding="async">
          </a>
        </section>
        <section class="stats-column">
          <h2>下級装飾品集計</h2>
          <a class="stats-image-link" href="/season2/data/lesser-trinket-stats.webp?v=20260727" target="_blank" rel="noopener">
            <img class="stats-image" src="/season2/data/lesser-trinket-stats.webp?v=20260727" width="3977" height="8572" alt="S級リーグ Season 2 下級装飾品集計表" decoding="async">
          </a>
        </section>
        <section class="stats-column">
          <h2>上級装飾品集計</h2>
          <a class="stats-image-link" href="/season2/data/greater-trinket-stats.webp?v=20260727" target="_blank" rel="noopener">
            <img class="stats-image" src="/season2/data/greater-trinket-stats.webp?v=20260727" width="4077" height="8116" alt="S級リーグ Season 2 上級装飾品集計表" decoding="async">
          </a>
        </section>
      </div>
    </section>
  </main>
</body>
</html>
