<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>リーグ集計 | S級リーグ Season 2</title>
  <meta name="description" content="S級リーグ Season 2のヒーロー、下級装飾品、上級装飾品の集計ページです。" />
  <meta property="og:title" content="リーグ集計 | S級リーグ Season 2" />
  <meta property="og:description" content="ヒーロー、下級装飾品、上級装飾品の集計データを掲載します。" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://stuntdrakesavenge.pages.dev/sq/season2/league-stats/" />
  <link rel="canonical" href="https://stuntdrakesavenge.pages.dev/sq/season2/league-stats/" />
  <link rel="stylesheet" href="/common.css" />
<style>
    .stats-shell{width:min(100% - 32px,1080px);margin:0 auto;padding:40px 0 72px}
    .stats-header{color:#fff}.stats-header .back-link{margin-bottom:38px;color:rgba(255,255,255,.76);background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
    .stats-header h1{margin:0;text-align:left;color:#fff;font-size:clamp(36px,6vw,58px)}
    .stats-header p{margin:14px 0 0;color:rgba(255,255,255,.72);font-weight:750}
    .stats-content{margin-top:28px;padding:clamp(22px,4vw,40px);border-radius:16px;background:rgba(255,250,242,.92);box-shadow:0 18px 44px rgba(3,14,24,.22);backdrop-filter:blur(9px)}
    .stats-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 28px}
    .stats-tab{min-height:44px;padding:0 18px;border:0;border-radius:7px;color:#53606b;background:rgba(16,38,56,.08);font:inherit;font-size:14px;font-weight:900;cursor:pointer;transition:color .16s ease,background .16s ease,box-shadow .16s ease}
    .stats-tab:hover{color:#0d7189;background:rgba(8,127,155,.12)}
    .stats-tab[aria-selected="true"]{color:#fff;background:#0d7f99;box-shadow:0 7px 18px rgba(13,127,153,.20)}
    .stats-panel[hidden]{display:none}
    .stats-panel h2{margin:0 0 16px;color:#18212a;font-size:clamp(20px,3vw,28px)}
    .stats-image-wrap{max-width:100%;overflow:auto;border-radius:4px;background:#fff;box-shadow:0 8px 24px rgba(24,33,40,.10)}
    .stats-image{display:block;width:100%;height:auto}
    @media(max-width:720px){.stats-shell{width:min(100% - 18px,1080px);padding:20px 0 50px}.stats-content{padding:18px 12px}.stats-tabs{gap:7px}.stats-tab{flex:1 1 auto;padding:0 10px;font-size:12px}.stats-image{width:900px;max-width:none}}
  </style>
<link rel="icon" href="/sutantic.png" type="image/png" />
</head>
<body>
  <main class="stats-shell">
    <header class="stats-header">
      <a class="back-link" href="/sq/season2/">← S級リーグ Season 2へ戻る</a>
      <h1>リーグ集計</h1>
      <p>S級リーグ Season 2</p>
    </header>
    <section class="stats-content">
      <div class="stats-tabs" role="tablist" aria-label="集計データ切り替え">
        <button class="stats-tab" type="button" role="tab" aria-selected="true" aria-controls="hero-panel" id="hero-tab" data-stats-target="hero-panel">ヒーロー集計</button>
        <button class="stats-tab" type="button" role="tab" aria-selected="false" aria-controls="lesser-panel" id="lesser-tab" data-stats-target="lesser-panel">下級装飾品</button>
        <button class="stats-tab" type="button" role="tab" aria-selected="false" aria-controls="greater-panel" id="greater-tab" data-stats-target="greater-panel">上級装飾品</button>
      </div>
      <section class="stats-panel" id="hero-panel" role="tabpanel" aria-labelledby="hero-tab">
        <h2>ヒーロー集計</h2>
        <div class="stats-image-wrap"><img class="stats-image" src="/season2/data/Hero.webp?v=20260726" width="3238" height="9777" alt="S級リーグ Season 2 ヒーロー集計表" decoding="async"></div>
      </section>
      <section class="stats-panel" id="lesser-panel" role="tabpanel" aria-labelledby="lesser-tab" hidden>
        <h2>下級装飾品集計</h2>
        <div class="stats-image-wrap"><img class="stats-image" src="/season2/data/Lesser.webp?v=20260726" width="4083" height="8572" alt="S級リーグ Season 2 下級装飾品集計表" loading="lazy" decoding="async"></div>
      </section>
      <section class="stats-panel" id="greater-panel" role="tabpanel" aria-labelledby="greater-tab" hidden>
        <h2>上級装飾品集計</h2>
        <div class="stats-image-wrap"><img class="stats-image" src="/season2/data/Greater.webp?v=20260726" width="4077" height="8116" alt="S級リーグ Season 2 上級装飾品集計表" loading="lazy" decoding="async"></div>
      </section>
    </section>
  </main>
  <script>
    (() => {
      const tabs = [...document.querySelectorAll('[data-stats-target]')];
      const panels = [...document.querySelectorAll('.stats-panel')];
      tabs.forEach((tab) => {
        tab.addEventListener('click', () => {
          tabs.forEach((item) => item.setAttribute('aria-selected', String(item === tab)));
          panels.forEach((panel) => { panel.hidden = panel.id !== tab.dataset.statsTarget; });
        });
      });
    })();
  </script>
</body>
</html>
