<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CN vs Worlds | Avenge Hub</title>
  <meta name="description" content="CN vs Worlds の大会情報をまとめるページです。" />
  <link rel="stylesheet" href="../../common.css" />
  <style>
    .tournament-hero{min-height:260px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(135deg,#071421 0%,#0a2f45 52%,#451d36 100%);border:1px solid rgba(255,255,255,.22);border-radius:18px;box-shadow:0 22px 40px rgba(3,14,24,.34)}
    .tournament-hero .back-link{align-self:flex-start;color:#fff;background:rgba(4,18,23,.42);border-color:rgba(255,255,255,.24)}
    .tournament-title-block{margin:2.2rem 0 0}
    .tournament-hero h1{margin:0;color:#fff;font-size:clamp(42px,6vw,76px);font-weight:950;letter-spacing:-.06em;text-shadow:0 10px 24px rgba(3,14,24,.48)}
    .tournament-hero .hero-subtitle{margin:10px 0 0;color:rgba(255,255,255,.88);font-size:clamp(18px,2vw,28px);font-weight:900;letter-spacing:.04em;text-shadow:0 5px 16px rgba(3,14,24,.45)}
    .rule-text-list{margin:0;padding-left:1.35rem;color:var(--text-secondary);font-size:15px;font-weight:750;line-height:1.95}
    .rule-text-list strong{color:var(--text-primary);font-weight:950}
    .placeholder-box{padding:18px 20px;color:var(--text-secondary);background:rgba(25,182,217,.08);border:1px solid rgba(25,182,217,.22);border-radius:10px;font-size:15px;font-weight:800;line-height:1.85}
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="hero tournament-hero">
      <a class="back-link" href="../../">← Avenge Hubへ戻る</a>
      <div class="tournament-title-block">
        <h1>CN vs Worlds</h1>
        <p class="hero-subtitle">2026 Jan-Feb</p>
      </div>
    </header>

    <section class="score-card">
      <div class="section-title">概要とルール</div>
      <div class="section-body">
        <ul class="rule-text-list">
          <li><strong>大会名：</strong>CN vs Worlds</li>
          <li><strong>詳細：</strong>準備中です。大会概要、ルール、出場選手、リンク等を受け取り次第、ここに反映します。</li>
        </ul>
      </div>
    </section>

    <section class="score-card">
      <div class="section-title orange">Tournament Links</div>
      <div class="section-body">
        <div class="placeholder-box">リンク情報は準備中です。</div>
      </div>
    </section>

    <footer class="footer-note"><p>Avenge Hub / Tournament info by Stuntdrake</p></footer>
  </main>
</body>
</html>
