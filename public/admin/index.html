<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>管理画面 | Stuntdrake's Avenge!</title>
  <link rel="stylesheet" href="/common.css" />
  <link rel="stylesheet" href="/admin/admin.css?v=20260616" />
  <link rel="icon" href="/sutantic.png" type="image/png" />
</head>
<body>
  <main class="admin-hub-shell">
    <nav class="admin-hub-nav">
      <a class="back-link" href="/">← メインページに戻る</a>
    </nav>

    <header class="admin-hub-hero">
      <p class="admin-hub-eyebrow">Administrator</p>
      <h1>管理画面</h1>
      <p>S級リーグとスクリムの管理画面をまとめています。操作する画面を選択してください。</p>
    </header>

    <section class="admin-hub-grid" aria-label="管理画面一覧">
      <a class="admin-hub-card" href="/sq/season1/admin/">
        <span class="admin-hub-card-label">S級リーグ</span>
        <h2>Season 1</h2>
        <p>DAY・GAMEごとの登場種族と非登場種族を設定します。</p>
        <span class="admin-hub-card-link">管理画面を開く <span aria-hidden="true">→</span></span>
      </a>

      <a class="admin-hub-card" href="/sq/season2/admin/">
        <span class="admin-hub-card-label">S級リーグ</span>
        <h2>Season 2</h2>
        <p>DAY・GAMEごとの登場種族と非登場種族を設定します。</p>
        <span class="admin-hub-card-link">管理画面を開く <span aria-hidden="true">→</span></span>
      </a>

      <a class="admin-hub-card admin-hub-card-scrim" href="/scrims/admin/">
        <span class="admin-hub-card-label">Scrim</span>
        <h2>スクリム管理</h2>
        <p>開催日程、参加申請、Past Lobbyをまとめて管理します。</p>
        <span class="admin-hub-card-link">管理画面を開く <span aria-hidden="true">→</span></span>
      </a>
    </section>

    <p class="admin-hub-note">各管理画面で更新を行うには、対応する管理用パスワードが必要です。</p>
  </main>
</body>
</html>
